{% extends './layout.html' %}

{% block title %}Mi Presentación{% endblock %}

{% block content %}

<script src = "{{ url_for('static', filename='JS/sendData.js') }}"></script>

<div class="card-container">
    {% if lang == 'es' %}
        <div class="card">
            <div class="card-content">
                <h3>Suma con Python en web</h3>
                <label for="num1">Número 1:</label>
                <input type="number" id="num1" oninput="sendData()" placeholder="Número 1">
                <br>
                <label for="num2">Número 2:</label>
                <input type="number" id="num2" oninput="sendData()" placeholder="Número 2">
                <br><br>
                <p id="result"></p>
            </div>
        </div>
    {% elif lang == 'ru' %}
        <div class="card">
            <div class="card-content">
                <h3>Сумма с Python в интернете</h3>
                <label for="num1">Число 1:</label>
                <input type="number" id="num1" oninput="sendData()" placeholder="Число 1">
                <br>
                <label for="num2">Число 2:</label>
                <input type="number" id="num2" oninput="sendData()" placeholder="Число 2">
                <br><br>
                <p id="result"></p>
            </div>
        </div>
    {% else %}
        <div class="card">
            <div class="card-content">
                <h3>Sum with Python on the web</h3>
                <label for="num1">Number 1:</label>
                <input type="number" id="num1" oninput="sendData()" placeholder="Number 1">
                <br>
                <label for="num2">Number 2:</label>
                <input type="number" id="num2" oninput="sendData()" placeholder="Number 2">
                <br><br>
                <p id="result"></p>
        </div>
    {% endif %}
</div>
{% endblock %}
